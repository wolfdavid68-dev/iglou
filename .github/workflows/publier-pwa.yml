# Publie la PWA (https://iglou.web.app) sur Firebase Hosting
# à chaque fusion sur master, ou à la main depuis l'onglet Actions.
#
# Secret GitHub requis : FIREBASE_SERVICE_ACCOUNT_CONGELATEUR_V91VD
# (clé JSON d'un compte de service du projet Firebase congelateur-v91vd,
# créé par `npx firebase-tools init hosting:github`).
name: Publier la PWA

on:
  push:
    branches: [master]
  workflow_dispatch:

# Une seule publication à la fois : la plus récente gagne.
concurrency:
  group: publier-pwa
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publier:
    runs-on: ubuntu-latest
    env:
      # Adresse publique du serveur Convex de production (comme dans eas.json).
      EXPO_PUBLIC_CONVEX_URL: https://grateful-fennec-82.convex.cloud
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier (types, lint, tests)
        run: |
          npx tsc --noEmit
          npx expo lint
          npm test

      - name: Construire la version web
        run: npx expo export -p web

      - name: Publier sur Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONGELATEUR_V91VD }}
          projectId: congelateur-v91vd
          channelId: live
