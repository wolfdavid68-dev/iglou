# Publie iglou : le serveur Convex de production (grateful-fennec-82), puis
# la PWA sur le VPS Hostinger (https://iglou.mediurg.systems).
#
# Le site construit est déposé dans la release « site-web » de ce dépôt (public).
# Sur le VPS, iglou-maj (installé par deploy/vps/installer.sh) vérifie toutes
# les 2 minutes s'il a changé et installe la nouvelle version : aucune clé du
# VPS n'est nécessaire ici, ni aucune clé GitHub sur le VPS.
#
# Se lance à chaque fusion sur master, ou à la main : onglet Actions →
# « Publier iglou » → Run workflow. Un agent (session Claude Code) la lance par
# l'API GitHub (workflow_dispatch sur master), voir AGENTS.md.
#
# Secret GitHub facultatif (Settings → Secrets and variables → Actions) :
#   CONVEX_DEPLOY_KEY  clé de déploiement de la production Convex (tableau de bord
#     Convex → Settings → Deploy keys). Sans elle, seule la PWA est publiée.
name: Publier iglou

on:
  push:
    branches: [master]
  workflow_dispatch:

# Une seule publication à la fois : la plus récente gagne.
concurrency:
  group: publier-pwa
  cancel-in-progress: true

permissions:
  # Pour mettre à jour la release « site-web ».
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    env:
      # Adresse publique du serveur Convex de production (comme dans eas.json).
      EXPO_PUBLIC_CONVEX_URL: https://grateful-fennec-82.convex.cloud
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier (types, lint, tests)
        run: |
          npx tsc --noEmit
          npx expo lint
          npm test

      # Le serveur d'abord : la nouvelle PWA ne doit pas appeler des fonctions qui n'existent pas encore.
      - name: Publier le serveur Convex
        if: env.CONVEX_DEPLOY_KEY != ''
        run: npx convex deploy --message "GitHub Actions ${GITHUB_SHA::7}"

      - name: Serveur Convex non publié
        if: env.CONVEX_DEPLOY_KEY == ''
        run: echo "::warning title=Serveur Convex non publié::Secret CONVEX_DEPLOY_KEY absent, seule la PWA est publiée."

      - name: Construire la version web
        run: |
          npx expo export -p web
          ./scripts/paquet-web.sh

      - name: Déposer la version pour le VPS (release site-web)
        run: |
          if ! gh release view site-web >/dev/null 2>&1; then
            gh release create site-web --prerelease --title "Site web (publication automatique)" \
              --notes "Dernière version de la PWA, installée automatiquement sur le VPS par iglou-maj. Ne pas supprimer."
          fi
          # L'empreinte en dernier : le VPS ne bascule qu'une fois l'archive complète en ligne.
          gh release upload site-web site.tar.gz --clobber
          gh release upload site-web site.tar.gz.sha256 --clobber

      - name: Résumé
        run: |
          {
            echo "### iglou publié"
            echo "- PWA : https://iglou.mediurg.systems (installée sur le VPS dans les 2 minutes)"
            if [ -n "$CONVEX_DEPLOY_KEY" ]; then echo "- Serveur Convex : grateful-fennec-82 (production)"; else echo "- Serveur Convex : **non publié** (secret CONVEX_DEPLOY_KEY absent)"; fi
            echo "- Version : \`$(cut -c1-12 site.tar.gz.sha256)\` (commit \`${GITHUB_SHA::7}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
